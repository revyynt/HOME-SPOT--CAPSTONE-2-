<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - MJP Residences</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body class="bg-gray-50">
    <div
      class="min-h-screen flex items-center justify-center py-12 px-4"
      style="background-color: #f5f5f5"
    >
      <div class="max-w-md w-full">
        <!-- Logo/Header -->
        <div class="text-center mb-8">
          <h1 class="text-2xl font-bold text-gray-900 mb-1">MJP Residences</h1>
          <p class="text-sm text-gray-600">Admin Portal Login</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-lg shadow-md p-8">
          <form id="loginForm">
            <div class="space-y-5">
              <!-- Email -->
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                <input
                  type="email"
                  name="email"
                  class="form-input"
                  placeholder="admin@mjpresidence.com"
                  required
                  style="border-color: #e5e7eb"
                />
              </div>

              <!-- Password -->
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                <input
                  type="password"
                  name="password"
                  class="form-input"
                  placeholder="••••••••"
                  required
                  style="border-color: #e5e7eb"
                />
              </div>

              <!-- Remember Me -->
              <div class="flex items-center">
                <input
                  type="checkbox"
                  id="remember"
                  class="w-4 h-4 text-blue-600 border-gray-300 rounded"
                />
                <label for="remember" class="ml-2 text-sm text-gray-700">Remember me</label>
              </div>

              <div id="loginError" class="mt-4 hidden"></div>

              <!-- Login Button -->
              <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition-colors"
              >
                Sign In
              </button>

              <!-- Access notice -->
              <div class="mt-4 p-4 bg-blue-50 rounded-lg border border-blue-100">
                <p class="text-xs text-gray-700 font-semibold mb-2">Staff access</p>
                <p class="text-xs text-blue-700">
                  Accounts are provisioned by a superadmin in Firebase Auth. Your role is read from
                  the <code class="bg-blue-100 px-1 rounded">users</code> document linked to your
                  account.
                </p>
              </div>
            </div>
          </form>
        </div>

        <!-- Back to Website -->
        <div class="text-center mt-6">
          <a href="./index.html" class="text-blue-600 hover:text-blue-700 text-sm">
            ← Back to Website
          </a>
        </div>
      </div>
    </div>

    <script type="module" src="./assets/js/firebase-service.js"></script>
    <script type="module" src="./assets/js/pages/admin-login.js"></script>
    <script type="module" src="./assets/js/main.js"></script>
  </body>
</html>
