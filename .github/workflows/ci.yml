name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, and secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci || npm --prefix functions install

      - name: Check formatting
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      # Includes tests/secrets.test.js, which fails if a real PayMongo key is
      # ever committed again.
      - name: Unit, structural, and secret-scan tests
        run: npm test

      - name: Verify no .env is tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked in git -- remove it and rotate the keys."
            exit 1
          fi
          echo "No .env tracked. OK."
